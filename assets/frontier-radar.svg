<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" fill="none">
  <defs>
    <style>
      @keyframes radar-sweep-rot {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes blip-glow {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.3); filter: drop-shadow(0 0 6px #34d399); }
      }
      @keyframes bar-fill-glow {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; filter: drop-shadow(0 0 4px #38bdf8); }
      }

      .radar-arm {
        transform-origin: 50px 50px;
        animation: radar-sweep-rot 4s linear infinite;
      }
      .blip-1 {
        transform-origin: 35px 35px;
        animation: blip-glow 2s ease-in-out infinite;
      }
      .blip-2 {
        transform-origin: 65px 42px;
        animation: blip-glow 2.5s ease-in-out infinite 0.7s;
      }
      .blip-3 {
        transform-origin: 40px 70px;
        animation: blip-glow 2.2s ease-in-out infinite 1.3s;
      }
      .bar-active {
        animation: bar-fill-glow 3s ease-in-out infinite;
      }
    </style>

    <linearGradient id="radar-screen-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030713" />
      <stop offset="50%" stop-color="#080e22" />
      <stop offset="100%" stop-color="#030612" />
    </linearGradient>

    <!-- Radar Sweep Beam Gradient -->
    <linearGradient id="sweep-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="card-panel-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1636" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#060c20" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Frame -->
  <rect x="0.5" y="0.5" width="899" height="199" rx="12" fill="url(#radar-screen-bg)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Top Bar -->
  <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 888 0 C 894.63 0 900 5.37 900 12 L 900 32 L 0 32 Z" fill="#080e20" />
  <line x1="0" y1="32" x2="900" y2="32" stroke="#1e293b" />

  <circle cx="18" cy="16" r="4" fill="#a855f7" />
  <text x="30" y="19.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#f8fafc" font-weight="700" letter-spacing="0.5">
    FRONTIER AI RADAR // WHAT TO LEARN NEXT FOR HIGH-IMPACT AI SYSTEMS ENGINEERS
  </text>
  <text x="880" y="19.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#a855f7" text-anchor="end" letter-spacing="0.5">
    ● ACTIVE TECHNICAL HORIZON
  </text>

  <!-- LEFT: ANIMATED MINI-RADAR SCOPE -->
  <g transform="translate(24, 46)">
    <!-- Radar Base Circles -->
    <circle cx="50" cy="50" r="46" fill="#04121e" stroke="#1e3a5f" stroke-width="1.2" />
    <circle cx="50" cy="50" r="32" fill="none" stroke="#1e3a5f" stroke-width="0.8" stroke-dasharray="2 3" />
    <circle cx="50" cy="50" r="16" fill="none" stroke="#1e3a5f" stroke-width="0.8" stroke-dasharray="2 3" />
    <line x1="4" y1="50" x2="96" y2="50" stroke="#1e3a5f" stroke-width="0.8" />
    <line x1="50" y1="4" x2="50" y2="96" stroke="#1e3a5f" stroke-width="0.8" />

    <!-- Sweeping Radar Beam -->
    <g class="radar-arm">
      <path d="M 50 50 L 50 4 A 46 46 0 0 1 88 28 Z" fill="url(#sweep-grad)" opacity="0.35" />
      <line x1="50" y1="50" x2="88" y2="28" stroke="#34d399" stroke-width="1.5" />
    </g>

    <!-- Radar Blips -->
    <circle cx="35" cy="35" r="3.5" fill="#38bdf8" class="blip-1" />
    <circle cx="65" cy="42" r="3.5" fill="#34d399" class="blip-2" />
    <circle cx="40" cy="70" r="3.5" fill="#a855f7" class="blip-3" />

    <!-- Center Pivot -->
    <circle cx="50" cy="50" r="3" fill="#34d399" />
    
    <text x="50" y="112" font-family="ui-monospace, monospace" font-size="9" fill="#64748b" text-anchor="middle" letter-spacing="0.5">
      SCANNING HORIZON
    </text>
    <text x="50" y="125" font-family="ui-monospace, monospace" font-size="9" fill="#34d399" text-anchor="middle" font-weight="700">
      2025 - 2026 ROADMAP
    </text>
  </g>

  <!-- RIGHT: 3 LEARNING VECTORS -->
  <!-- Vector 1: GPU Kernels & Triton -->
  <g transform="translate(148, 44)">
    <rect x="0" y="0" width="236" height="142" rx="8" fill="url(#card-panel-bg)" stroke="#1e293b" />
    <circle cx="14" cy="18" r="3.5" fill="#38bdf8" />
    <text x="24" y="21.5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#38bdf8">
      01 · GPU KERNELS &amp; TRITON
    </text>
    <line x1="10" y1="32" x2="226" y2="32" stroke="#1e293b" />

    <g transform="translate(12, 48)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">
      <text y="0">✦ Writing fused attention in Triton</text>
      <text y="18">✦ SRAM cache reuse vs HBM latency</text>
      <text y="36">✦ FP8 / FP4 quantization (AWQ/Marlin)</text>
    </g>

    <g transform="translate(12, 114)">
      <rect x="0" y="0" width="212" height="14" rx="4" fill="#08142c" stroke="#1e293b" />
      <rect x="1" y="1" width="145" height="12" rx="3" fill="#38bdf8" opacity="0.85" class="bar-active" />
      <text x="106" y="10" font-family="ui-monospace, monospace" font-size="8.5" fill="#ffffff" font-weight="700" text-anchor="middle">
        68% MASTERY TARGET
      </text>
    </g>
  </g>

  <!-- Vector 2: High-Throughput Serving -->
  <g transform="translate(398, 44)">
    <rect x="0" y="0" width="236" height="142" rx="8" fill="url(#card-panel-bg)" stroke="#1e293b" />
    <circle cx="14" cy="18" r="3.5" fill="#34d399" />
    <text x="24" y="21.5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#34d399">
      02 · INFERENCE SERVING (vLLM)
    </text>
    <line x1="10" y1="32" x2="226" y2="32" stroke="#1e293b" />

    <g transform="translate(12, 48)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">
      <text y="0">✦ PagedAttention KV fragmentation</text>
      <text y="18">✦ Continuous dynamic batching</text>
      <text y="36">✦ Speculative decoding for sub-10ms</text>
    </g>

    <g transform="translate(12, 114)">
      <rect x="0" y="0" width="212" height="14" rx="4" fill="#082216" stroke="#1e293b" />
      <rect x="1" y="1" width="168" height="12" rx="3" fill="#34d399" opacity="0.85" class="bar-active" />
      <text x="106" y="10" font-family="ui-monospace, monospace" font-size="8.5" fill="#ffffff" font-weight="700" text-anchor="middle">
        80% SERVING BENCHMARKS
      </text>
    </g>
  </g>

  <!-- Vector 3: Reasoning & Post-Training -->
  <g transform="translate(648, 44)">
    <rect x="0" y="0" width="236" height="142" rx="8" fill="url(#card-panel-bg)" stroke="#1e293b" />
    <circle cx="14" cy="18" r="3.5" fill="#a855f7" />
    <text x="24" y="21.5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#a855f7">
      03 · REASONING &amp; RLVR
    </text>
    <line x1="10" y1="32" x2="226" y2="32" stroke="#1e293b" />

    <g transform="translate(12, 48)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">
      <text y="0">✦ RL with Verifiable Rewards (RLVR)</text>
      <text y="18">✦ GRPO policy optimization</text>
      <text y="36">✦ Model Context Protocol (MCP)</text>
    </g>

    <g transform="translate(12, 114)">
      <rect x="0" y="0" width="212" height="14" rx="4" fill="#1e0c38" stroke="#1e293b" />
      <rect x="1" y="1" width="130" height="12" rx="3" fill="#a855f7" opacity="0.85" class="bar-active" />
      <text x="106" y="10" font-family="ui-monospace, monospace" font-size="8.5" fill="#ffffff" font-weight="700" text-anchor="middle">
        62% RL POST-TRAINING
      </text>
    </g>
  </g>
</svg>
