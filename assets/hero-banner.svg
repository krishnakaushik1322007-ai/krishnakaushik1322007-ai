<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="900" height="310" fill="none">
  <defs>
    <style>
      @keyframes pulse-cyan {
        0%, 100% { opacity: 0.18; transform: scale(1); }
        50% { opacity: 0.38; transform: scale(1.1); }
      }
      @keyframes pulse-purple {
        0%, 100% { opacity: 0.14; transform: scale(1); }
        50% { opacity: 0.32; transform: scale(1.08); }
      }
      @keyframes ping-ring {
        0% { r: 4; opacity: 1; stroke-width: 2; }
        70% { r: 12; opacity: 0; stroke-width: 0.5; }
        100% { r: 12; opacity: 0; stroke-width: 0; }
      }
      @keyframes cursor-blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes border-glow-run {
        0% { stroke: #38bdf8; filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.6)); }
        33% { stroke: #818cf8; filter: drop-shadow(0 0 6px rgba(129, 140, 248, 0.6)); }
        66% { stroke: #34d399; filter: drop-shadow(0 0 6px rgba(52, 211, 153, 0.6)); }
        100% { stroke: #38bdf8; filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.6)); }
      }
      @keyframes typing-line-1 {
        0%, 30% { opacity: 1; }
        33%, 100% { opacity: 0; }
      }
      @keyframes typing-line-2 {
        0%, 33% { opacity: 0; }
        36%, 63% { opacity: 1; }
        66%, 100% { opacity: 0; }
      }
      @keyframes typing-line-3 {
        0%, 66% { opacity: 0; }
        69%, 97% { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes eq-bar-1 { 0%, 100% { height: 6px; y: 16px; } 50% { height: 20px; y: 2px; } }
      @keyframes eq-bar-2 { 0%, 100% { height: 18px; y: 4px; } 50% { height: 8px; y: 14px; } }
      @keyframes eq-bar-3 { 0%, 100% { height: 10px; y: 12px; } 50% { height: 22px; y: 0px; } }
      @keyframes eq-bar-4 { 0%, 100% { height: 22px; y: 0px; } 50% { height: 12px; y: 10px; } }
      @keyframes eq-bar-5 { 0%, 100% { height: 14px; y: 8px; } 50% { height: 24px; y: -2px; } }
      @keyframes shimmer-pill {
        0% { transform: translateX(-100px); }
        100% { transform: translateX(250px); }
      }

      .ambient-cyan {
        transform-origin: 20% 30%;
        animation: pulse-cyan 6s ease-in-out infinite;
      }
      .ambient-purple {
        transform-origin: 80% 60%;
        animation: pulse-purple 7s ease-in-out infinite;
      }
      .status-ping {
        animation: ping-ring 2.4s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      .term-cursor {
        animation: cursor-blink 0.9s step-start infinite;
      }
      .frame-border {
        animation: border-glow-run 8s ease-in-out infinite;
      }
      .type-text-1 {
        animation: typing-line-1 9s ease-in-out infinite;
      }
      .type-text-2 {
        animation: typing-line-2 9s ease-in-out infinite;
      }
      .type-text-3 {
        animation: typing-line-3 9s ease-in-out infinite;
      }
      .b1 { animation: eq-bar-1 1.2s ease-in-out infinite; }
      .b2 { animation: eq-bar-2 1.5s ease-in-out infinite 0.2s; }
      .b3 { animation: eq-bar-3 1.1s ease-in-out infinite 0.4s; }
      .b4 { animation: eq-bar-4 1.4s ease-in-out infinite 0.1s; }
      .b5 { animation: eq-bar-5 1.3s ease-in-out infinite 0.3s; }
    </style>

    <!-- Background Gradients -->
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="45%" stop-color="#080f24" />
      <stop offset="100%" stop-color="#020510" />
    </linearGradient>

    <!-- Radial Glowing Orbs -->
    <radialGradient id="glow-cyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-purple" cx="80%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="hero-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#334155" fill-opacity="0.32" />
    </pattern>

    <!-- Card Backgrounds -->
    <linearGradient id="metric-card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1838" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#060c20" stop-opacity="0.9" />
    </linearGradient>

    <!-- Shimmer Mask -->
    <linearGradient id="shimmer-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Outer Canvas Box with Animated Neon Border -->
  <rect x="1" y="1" width="898" height="308" rx="14" fill="url(#hero-bg)" stroke="#38bdf8" stroke-width="1.3" class="frame-border" />

  <!-- Ambient Light Orbs -->
  <rect x="2" y="2" width="896" height="306" rx="14" fill="url(#glow-cyan)" class="ambient-cyan" />
  <rect x="2" y="2" width="896" height="306" rx="14" fill="url(#glow-purple)" class="ambient-purple" />
  <rect x="2" y="34" width="896" height="274" fill="url(#hero-dots)" />

  <!-- Top macOS Window Header Bar -->
  <path d="M 0 14 C 0 6.27 6.27 0 14 0 L 886 0 C 893.73 0 900 6.27 900 14 L 900 34 L 0 34 Z" fill="#080e22" />
  <line x1="0" y1="34" x2="900" y2="34" stroke="#1e293b" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="20" cy="17" r="4.5" fill="#ef4444" opacity="0.9" />
  <circle cx="36" cy="17" r="4.5" fill="#f59e0b" opacity="0.9" />
  <circle cx="52" cy="17" r="4.5" fill="#10b981" opacity="0.9" />

  <!-- Window Path Title -->
  <text x="74" y="21" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#64748b" letter-spacing="0.5">
    krishna-kaushik // ai-systems-portfolio.sys
  </text>

  <!-- Top Right Pulsing Status Indicator -->
  <g transform="translate(640, 8)">
    <rect x="0" y="0" width="242" height="20" rx="10" fill="#0b1736" stroke="#1e293b" />
    <circle cx="12" cy="10" r="3.5" fill="#34d399" />
    <circle cx="12" cy="10" r="3.5" stroke="#34d399" fill="none" class="status-ping" />
    <text x="26" y="13.5" font-family="ui-monospace, monospace" font-size="9.5" fill="#34d399" font-weight="700" letter-spacing="0.4">
      AVAILABLE FOR ROLES · 2025/2026
    </text>
  </g>

  <!-- MAIN HERO CONTENT -->
  <!-- Status Badge with Green Ping Dot -->
  <g transform="translate(32, 54)">
    <rect x="0" y="0" width="310" height="24" rx="12" fill="#0b1736" stroke="#1e293b" />
    <circle cx="12" cy="12" r="3.5" fill="#38bdf8" />
    <text x="24" y="15.5" font-family="ui-monospace, monospace" font-size="10.5" fill="#e2e8f0" font-weight="600" letter-spacing="0.5">
      B.TECH CSE (AI) · SHOOLINI UNIVERSITY
    </text>
  </g>

  <!-- Main Headline Name -->
  <text x="32" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.8">
    Krishna Kaushik
  </text>

  <!-- High-Impact Title -->
  <text x="32" y="146" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#38bdf8" letter-spacing="0.2">
    AI Systems Engineer &amp; Full-Stack Architect
  </text>

  <!-- Animated Terminal Typing Prompt Stream -->
  <g transform="translate(32, 164)">
    <!-- Terminal prefix -->
    <text x="0" y="14" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" font-weight="700" fill="#34d399">
      ➜
    </text>
    <text x="18" y="14" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" font-weight="600" fill="#94a3b8">
      focus:
    </text>

    <!-- Line 1: AI & RAG -->
    <g class="type-text-1">
      <text x="76" y="14" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" font-weight="500" fill="#f8fafc">
        "Architecting Self-Reflective RAG Engines &amp; Autonomous Multi-Agent Platforms"
      </text>
      <rect x="710" y="3" width="7" height="14" fill="#38bdf8" class="term-cursor" />
    </g>

    <!-- Line 2: Spatial & Systems -->
    <g class="type-text-2">
      <text x="76" y="14" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" font-weight="500" fill="#f8fafc">
        "Optimizing Sub-Meter PostGIS Spatial Math &amp; C++20 Low-Level Engines"
      </text>
      <rect x="635" y="3" width="7" height="14" fill="#34d399" class="term-cursor" />
    </g>

    <!-- Line 3: Production & Verification -->
    <g class="type-text-3">
      <text x="76" y="14" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" font-weight="500" fill="#f8fafc">
        "Eliminating LLM Hallucinations with Multi-Stage Cross-Encoder Verification"
      </text>
      <rect x="680" y="3" width="7" height="14" fill="#818cf8" class="term-cursor" />
    </g>
  </g>

  <!-- Recruiter Fast Proof: 4 Quantified Impact Cards -->
  <g transform="translate(32, 202)">
    <!-- Card 1: CivicLens -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="198" height="82" rx="9" fill="url(#metric-card-bg)" stroke="#1e293b" />
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#34d399">
        40.4% Dedup
      </text>
      <text x="14" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#f8fafc">
        CivicLens 311 Triage
      </text>
      <text x="14" y="58" font-family="ui-monospace, monospace" font-size="9.5" fill="#94a3b8">
        PostGIS ST_DWithin + Vision
      </text>
      <line x1="14" y1="68" x2="184" y2="68" stroke="#34d399" stroke-width="2" opacity="0.8" />
    </g>

    <!-- Card 2: CampusOS AI -->
    <g transform="translate(212, 0)">
      <rect x="0" y="0" width="198" height="82" rx="9" fill="url(#metric-card-bg)" stroke="#1e293b" />
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#38bdf8">
        15 RLS Tables
      </text>
      <text x="14" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#f8fafc">
        CampusOS AI SaaS
      </text>
      <text x="14" y="58" font-family="ui-monospace, monospace" font-size="9.5" fill="#94a3b8">
        Multi-Tenant RBAC Security
      </text>
      <line x1="14" y1="68" x2="184" y2="68" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
    </g>

    <!-- Card 3: Agentic RAG -->
    <g transform="translate(424, 0)">
      <rect x="0" y="0" width="198" height="82" rx="9" fill="url(#metric-card-bg)" stroke="#1e293b" />
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#818cf8">
        8/8 Verified
      </text>
      <text x="14" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#f8fafc">
        Self-Reflective RAG
      </text>
      <text x="14" y="58" font-family="ui-monospace, monospace" font-size="9.5" fill="#94a3b8">
        Zero Hallucination Retrieval
      </text>
      <line x1="14" y1="68" x2="184" y2="68" stroke="#818cf8" stroke-width="2" opacity="0.8" />
    </g>

    <!-- Card 4: ZENETH C++20 -->
    <g transform="translate(636, 0)">
      <rect x="0" y="0" width="200" height="82" rx="9" fill="url(#metric-card-bg)" stroke="#1e293b" />
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#f59e0b">
        C++20 Engine
      </text>
      <text x="14" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#f8fafc">
        ZENETH Pathology
      </text>
      <text x="14" y="58" font-family="ui-monospace, monospace" font-size="9.5" fill="#94a3b8">
        Deterministic Diagnostics
      </text>
      <line x1="14" y1="68" x2="186" y2="68" stroke="#f59e0b" stroke-width="2" opacity="0.8" />
    </g>
  </g>

  <!-- Live Audio / Inference Equalizer Waveform in Header -->
  <g transform="translate(585, 12)">
    <rect x="0" y="16" width="3" height="6" rx="1.5" fill="#38bdf8" class="b1" />
    <rect x="6" y="4" width="3" height="18" rx="1.5" fill="#38bdf8" class="b2" />
    <rect x="12" y="12" width="3" height="10" rx="1.5" fill="#34d399" class="b3" />
    <rect x="18" y="0" width="3" height="22" rx="1.5" fill="#34d399" class="b4" />
    <rect x="24" y="8" width="3" height="14" rx="1.5" fill="#818cf8" class="b5" />
  </g>
</svg>
