      <rect x="0" y="15" width="12" height="12" class="grid-cell active-3" />
      <rect x="0" y="30" width="12" height="12" class="grid-cell active-4" />
      <rect x="0" y="45" width="12" height="12" class="grid-cell active-3" />
      <rect x="0" y="60" width="12" height="12" class="grid-cell active-1" />
      <rect x="0" y="75" width="12" height="12" class="grid-cell active-4" />
      <rect x="0" y="90" width="12" height="12" class="grid-cell active-2" />
    </g>

    <!-- Animated Snake Crawling -->
    <g class="snake-group">
      <rect x="16" y="45" width="12" height="12" class="snake-body" rx="3" />
      <rect x="32" y="45" width="12" height="12" class="snake-body" rx="3" />
      <rect x="48" y="45" width="12" height="12" class="snake-body" rx="3" />
      <rect x="64" y="45" width="12" height="12" class="snake-body" rx="3" />
      <rect x="80" y="45" width="12" height="12" class="snake-body" rx="3" />
      <rect x="96" y="45" width="12" height="12" class="snake-head" rx="4" />
    </g>

    <!-- Fill rest of grid -->
    <g transform="translate(96, 0)">
      <rect x="0" y="0" width="12" height="12" class="grid-cell active-3" />
      <rect x="0" y="15" width="12" height="12" class="grid-cell active-2" />
      <rect x="0" y="30" width="12" height="12" class="grid-cell active-1" />
      <rect x="0" y="60" width="12" height="12" class="grid-cell active-2" />
