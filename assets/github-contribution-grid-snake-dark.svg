    <g transform="translate(112, 0)">
      <rect x="0" y="0" width="12" height="12" class="grid-cell active-4" />
      <rect x="0" y="15" width="12" height="12" class="grid-cell active-3" />
      <rect x="0" y="30" width="12" height="12" class="grid-cell active-2" />
      <rect x="0" y="45" width="12" height="12" class="grid-cell active-4" />
      <rect x="0" y="60" width="12" height="12" class="grid-cell active-3" />
