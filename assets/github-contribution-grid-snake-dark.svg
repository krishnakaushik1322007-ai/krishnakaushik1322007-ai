<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 140" width="100%" height="140" style="background: #0d1117; border-radius: 8px;">
  <style>
    .grid-cell { fill: #161b22; rx: 3; ry: 3; }
    .active-1 { fill: #0e4429; }
    .active-2 { fill: #006d32; }
    .active-3 { fill: #26a641; }
    .active-4 { fill: #39d353; }
    .neon-cell { fill: #00F5D4; filter: drop-shadow(0 0 4px #00F5D4); }
    .snake-head { fill: #7928CA; filter: drop-shadow(0 0 6px #FF007F); }
    .snake-body { fill: #00F5D4; filter: drop-shadow(0 0 4px #00F5D4); }
    
    @keyframes crawl {
      0% { transform: translateX(0px); }
      50% { transform: translateX(380px); }
      100% { transform: translateX(0px); }
    }
    .snake-group {
      animation: crawl 12s ease-in-out infinite alternate;
    }
  </style>

  <!-- Background grid sample -->
  <g transform="translate(25, 20)">
    <!-- Week Columns -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="12" height="12" class="grid-cell active-1" />
      <rect x="0" y="15" width="12" height="12" class="grid-cell" />
      <rect x="0" y="30" width="12" height="12" class="grid-cell active-2" />
      <rect x="0" y="45" width="12" height="12" class="grid-cell" />
      <rect x="0" y="60" width="12" height="12" class="grid-cell active-3" />
      <rect x="0" y="75" width="12" height="12" class="grid-cell active-1" />
      <rect x="0" y="90" width="12" height="12" class="grid-cell" />
    </g>
    <g transform="translate(16, 0)">
      <rect x="0" y="0" width="12" height="12" class="grid-cell active-3" />
      <rect x="0" y="15" width="12" height="12" class="grid-cell active-4" />
      <rect x="0" y="30" width="12" height="12" class="grid-cell active-2" />
      <rect x="0" y="45" width="12" height="12" class="grid-cell active-3" />
      <rect x="0" y="60" width="12" height="12" class="grid-cell" />
      <rect x="0" y="75" width="12" height="12" class="grid-cell active-4" />
      <rect x="0" y="90" width="12" height="12" class="grid-cell active-2" />
    </g>
    <g transform="translate(32, 0)">
      <rect x="0" y="0" width="12" height="12" class="grid-cell active-2" />
      <rect x="0" y="15" width="12" height="12" class="grid-cell active-1" />
      <rect x="0" y="30" width="12" height="12" class="grid-cell active-4" />
      <rect x="0" y="45" width="12" height="12" class="grid-cell active-3" />
      <rect x="0" y="60" width="12" height="12" class="grid-cell active-2" />
      <rect x="0" y="75" width="12" height="12" class="grid-cell" />
      <rect x="0" y="90" width="12" height="12" class="grid-cell active-1" />
    </g>
    <g transform="translate(48, 0)">
      <rect x="0" y="0" width="12" height="12" class="grid-cell active-4" />
      <rect x="0" y="15" width="12" height="12" class="grid-cell active-3" />
      <rect x="0" y="30" width="12" height="12" class="grid-cell active-2" />
      <rect x="0" y="45" width="12" height="12" class="grid-cell active-4" />
      <rect x="0" y="60" width="12" height="12" class="grid-cell active-1" />
      <rect x="0" y="75" width="12" height="12" class="grid-cell active-3" />
      <rect x="0" y="90" width="12" height="12" class="grid-cell active-4" />
    </g>
    <!-- Pattern filling across the board -->
    <g transform="translate(64, 0)">
      <rect x="0" y="0" width="12" height="12" class="grid-cell active-1" />
      <rect x="0" y="15" width="12" height="12" class="grid-cell active-2" />
      <rect x="0" y="30" width="12" height="12" class="grid-cell active-3" />
      <rect x="0" y="45" width="12" height="12" class="grid-cell active-1" />
