<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 435 200" width="435" height="200" fill="none">
  <defs>
    <style>
      @keyframes ping-rag {
        0% { r: 4; opacity: 1; stroke-width: 1.5; }
        70% { r: 12; opacity: 0; stroke-width: 0.5; }
        100% { r: 12; opacity: 0; }
      }
      @keyframes border-rag {
        0%, 100% { stroke: #38bdf8; filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.4)); }
        50% { stroke: #818cf8; filter: drop-shadow(0 0 4px rgba(129, 140, 248, 0.4)); }
      }
      .r-ping { animation: ping-rag 2.2s cubic-bezier(0, 0, 0.2, 1) infinite; }
      .r-border { animation: border-rag 5s ease-in-out infinite; }
    </style>

    <linearGradient id="card-rag-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061224" />
      <stop offset="60%" stop-color="#081a38" />
      <stop offset="100%" stop-color="#030814" />
    </linearGradient>
  </defs>

  <!-- Outer Card Frame with Animated Glow -->
  <rect x="0.5" y="0.5" width="434" height="199" rx="10" fill="url(#card-rag-bg)" stroke="#38bdf8" stroke-width="1.3" class="r-border" />

  <!-- Top Header Row -->
  <g transform="translate(16, 16)">
    <circle cx="10" cy="10" r="4" fill="#38bdf8" />
    <circle cx="10" cy="10" r="4" stroke="#38bdf8" fill="none" class="r-ping" />
    <text x="24" y="14" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#38bdf8" font-weight="700" letter-spacing="0.6">
      AGENTIC AI // ZERO-HALLUCINATION RAG
    </text>

    <!-- Measured Impact Pill -->
    <rect x="272" y="0" width="132" height="22" rx="11" fill="#082845" stroke="#38bdf8" />
    <text x="338" y="15" font-family="ui-monospace, monospace" font-size="10" fill="#38bdf8" font-weight="800" text-anchor="middle">
      8/8 VERIFIED TESTS
    </text>
  </g>

  <!-- Project Title & Subtitle -->
  <text x="16" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#ffffff">
    Agentic-RAG-Engine
  </text>
  <text x="16" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#94a3b8">
    Self-Reflective Hybrid Retrieval &amp; Cross-Encoder Verification
  </text>

  <!-- 3 High-Impact Value Bullets -->
  <g transform="translate(16, 108)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#cbd5e1">
    <text y="0">✦ <tspan fill="#ffffff" font-weight="600">Problem:</tspan> Silent LLM hallucinations in mission-critical RAG.</text>
    <text y="19">✦ <tspan fill="#ffffff" font-weight="600">Architecture:</tspan> Query rewrite loops + BM25/Vector hybrid retrieval.</text>
    <text y="38">✦ <tspan fill="#ffffff" font-weight="600">Impact:</tspan> <tspan fill="#38bdf8" font-weight="700">Multi-stage document grading</tspan> rejecting ungrounded claims.</text>
  </g>

  <!-- Bottom Technology Tags -->
  <g transform="translate(16, 170)">
    <rect x="0" y="0" width="80" height="18" rx="4" fill="#0c2547" stroke="#0284c7" />
    <text x="40" y="12.5" font-family="ui-monospace, monospace" font-size="9" fill="#38bdf8" text-anchor="middle">Gemini 2.5</text>

    <rect x="87" y="0" width="70" height="18" rx="4" fill="#0c2547" stroke="#0284c7" />
    <text x="122" y="12.5" font-family="ui-monospace, monospace" font-size="9" fill="#34d399" text-anchor="middle">pgvector</text>

    <rect x="164" y="0" width="90" height="18" rx="4" fill="#0c2547" stroke="#0284c7" />
    <text x="209" y="12.5" font-family="ui-monospace, monospace" font-size="9" fill="#e2e8f0" text-anchor="middle">BM25 Hybrid</text>

    <rect x="261" y="0" width="60" height="18" rx="4" fill="#0c2547" stroke="#0284c7" />
    <text x="291" y="12.5" font-family="ui-monospace, monospace" font-size="9" fill="#e2e8f0" text-anchor="middle">Python</text>

    <text x="398" y="13" font-family="ui-monospace, monospace" font-size="10" fill="#38bdf8" text-anchor="end" font-weight="700">
      VIEW REPO ↗
    </text>
  </g>
</svg>
