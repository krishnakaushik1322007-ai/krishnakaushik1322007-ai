<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160" fill="none">
  <defs>
    <style>
      @keyframes border-glow-exec {
        0%, 100% { stroke: #38bdf8; filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.4)); }
        50% { stroke: #818cf8; filter: drop-shadow(0 0 4px rgba(129, 140, 248, 0.4)); }
      }
      .exec-frame {
        animation: border-glow-exec 6s ease-in-out infinite;
      }
    </style>

    <linearGradient id="exec-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030713" />
      <stop offset="50%" stop-color="#080e24" />
      <stop offset="100%" stop-color="#020510" />
    </linearGradient>

    <linearGradient id="col-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1636" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#060c20" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Frame with Animated Glowing Border -->
  <rect x="0.5" y="0.5" width="899" height="159" rx="12" fill="url(#exec-bg)" stroke="#38bdf8" stroke-width="1.3" class="exec-frame" />

  <!-- Top Bar -->
  <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 888 0 C 894.63 0 900 5.37 900 12 L 900 30 L 0 30 Z" fill="#080e22" />
  <line x1="0" y1="30" x2="900" y2="30" stroke="#1e293b" />

  <circle cx="18" cy="15" r="3.5" fill="#34d399" />
  <text x="28" y="18.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#f8fafc" font-weight="700" letter-spacing="0.6">
    EXECUTIVE CANDIDATE SUMMARY // FAST-SCAN FOR HIRING MANAGERS &amp; TECH LEADS
  </text>
  <text x="882" y="18.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#38bdf8" text-anchor="end" letter-spacing="0.5">
    30-SECOND RECRUITER DOSSIER
  </text>

  <!-- 4 Quick-Scan Columns -->
  <!-- Col 1: Foundation -->
  <g transform="translate(16, 40)">
    <rect x="0" y="0" width="206" height="106" rx="8" fill="url(#col-glass)" stroke="#1e293b" />
    <text x="14" y="20" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#38bdf8">
      01 · FOUNDATION
    </text>
    <line x1="12" y1="28" x2="194" y2="28" stroke="#1e293b" />
    <g transform="translate(14, 46)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">
      <text y="0">✦ <tspan fill="#ffffff" font-weight="600">B.Tech CSE (AI)</tspan></text>
      <text y="19">✦ Shoolini University, India</text>
      <text y="38">✦ 2024 – 2028 Academic Cohort</text>
    </g>
  </g>

  <!-- Col 2: Core Strength -->
  <g transform="translate(234, 40)">
    <rect x="0" y="0" width="206" height="106" rx="8" fill="url(#col-glass)" stroke="#1e293b" />
    <text x="14" y="20" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#818cf8">
      02 · CORE SPECIALTY
    </text>
    <line x1="12" y1="28" x2="194" y2="28" stroke="#1e293b" />
    <g transform="translate(14, 46)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">
      <text y="0">✦ <tspan fill="#ffffff" font-weight="600">AI Systems Engineering</tspan></text>
      <text y="19">✦ Low-Level C++20 Execution</text>
      <text y="38">✦ Sub-Meter PostGIS Spatial Math</text>
    </g>
  </g>

  <!-- Col 3: Measured Impact -->
  <g transform="translate(452, 40)">
    <rect x="0" y="0" width="206" height="106" rx="8" fill="url(#col-glass)" stroke="#1e293b" />
    <text x="14" y="20" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#34d399">
      03 · MEASURED IMPACT
    </text>
    <line x1="12" y1="28" x2="194" y2="28" stroke="#1e293b" />
    <g transform="translate(14, 46)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">
      <text y="0">✦ <tspan fill="#34d399" font-weight="700">40.4% noise reduction</tspan></text>
      <text y="19">✦ 15 Supabase RLS security tables</text>
      <text y="38">✦ 8/8 verified RAG tests passed</text>
    </g>
  </g>

  <!-- Col 4: Role Target & Availability -->
  <g transform="translate(670, 40)">
    <rect x="0" y="0" width="214" height="106" rx="8" fill="url(#col-glass)" stroke="#1e293b" />
    <text x="14" y="20" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#f59e0b">
      04 · HIRING TARGET
    </text>
    <line x1="12" y1="28" x2="202" y2="28" stroke="#1e293b" />
    <g transform="translate(14, 46)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">
      <text y="0">✦ <tspan fill="#ffffff" font-weight="600">AI Systems / SWE Intern</tspan></text>
      <text y="19">✦ Summer / Fall 2025/2026</text>
      <text y="38">✦ <tspan fill="#34d399" font-weight="700">Open to global remote / onsite</tspan></text>
    </g>
  </g>
</svg>
