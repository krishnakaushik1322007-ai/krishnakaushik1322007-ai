<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 155" width="900" height="155" fill="none">
  <defs>
    <style>
      @keyframes border-glow-exec {
        0%, 100% { stroke: #00f0ff; stroke-opacity: 0.7; }
        50% { stroke: #a855f7; stroke-opacity: 0.7; }
      }
      .exec-frame {
        animation: border-glow-exec 5s ease-in-out infinite;
      }
    </style>

    <linearGradient id="exec-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040817" />
      <stop offset="50%" stop-color="#080f28" />
      <stop offset="100%" stop-color="#05091a" />
    </linearGradient>

    <linearGradient id="col-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1636" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#060b1e" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Frame with Animated Glowing Border -->
  <rect x="0.5" y="0.5" width="899" height="154" rx="12" fill="url(#exec-bg)" stroke="#00f0ff" stroke-width="1.2" class="exec-frame" />

  <!-- Top Bar -->
  <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 888 0 C 894.63 0 900 5.37 900 12 L 900 28 L 0 28 Z" fill="#09112a" />
  <line x1="0" y1="28" x2="900" y2="28" stroke="#1e293b" />

  <circle cx="18" cy="14" r="3.5" fill="#00ff9d" />
  <text x="28" y="17.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#f8fafc" font-weight="700" letter-spacing="0.6">
    EXECUTIVE CANDIDATE SUMMARY  //  FAST-SCAN FOR HIRING MANAGERS &amp; RECRUITERS
  </text>
  <text x="882" y="17.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#00f0ff" text-anchor="end" letter-spacing="0.5">
    30-SECOND RECRUITER OVERVIEW
  </text>

  <!-- 4 Quick-Scan Columns -->
  <!-- Col 1: Foundation -->
  <g transform="translate(16, 38)">
    <rect x="0" y="0" width="206" height="104" rx="7" fill="url(#col-glass)" stroke="#1e293b" />
    <text x="12" y="18" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#00f0ff">
      🎓 01 / BACKGROUND
    </text>
    <line x1="10" y1="26" x2="196" y2="26" stroke="#1e293b" />
    <g transform="translate(12, 42)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">
      <text y="0">✦ B.Tech CSE (Artificial Intelligence)</text>
      <text y="18">✦ Shoolini University, India</text>
      <text y="36">✦ Low-Level Systems + AI Focus</text>
    </g>
  </g>

  <!-- Col 2: Core Strength -->
  <g transform="translate(234, 38)">
    <rect x="0" y="0" width="206" height="104" rx="7" fill="url(#col-glass)" stroke="#1e293b" />
    <text x="12" y="18" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#a855f7">
      ⚡ 02 / CORE STRENGTH
    </text>
    <line x1="10" y1="26" x2="196" y2="26" stroke="#1e293b" />
    <g transform="translate(12, 42)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">
      <text y="0">✦ C/C++ Bare-Metal Speed</text>
      <text y="18">✦ Next.js 16 + FastAPI Full-Stack</text>
      <text y="36">✦ PostGIS Geospatial Math</text>
    </g>
  </g>

  <!-- Col 3: Proven Impact -->
  <g transform="translate(452, 38)">
    <rect x="0" y="0" width="206" height="104" rx="7" fill="url(#col-glass)" stroke="#1e293b" />
    <text x="12" y="18" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#00ff9d">
      🏆 03 / MEASURED OUTCOMES
    </text>
    <line x1="10" y1="26" x2="196" y2="26" stroke="#1e293b" />
    <g transform="translate(12, 42)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">
      <text y="0">✦ <tspan fill="#00ff9d" font-weight="600">40.4%</tspan> Duplicate Noise Reduction</text>
      <text y="18">✦ <tspan fill="#f8fafc" font-weight="600">15</tspan> PostgreSQL RLS Tables</text>
      <text y="36">✦ <tspan fill="#f8fafc" font-weight="600">8/8</tspan> Automated Test Passes</text>
    </g>
  </g>

  <!-- Col 4: Availability -->
  <g transform="translate(670, 38)">
    <rect x="0" y="0" width="214" height="104" rx="7" fill="url(#col-glass)" stroke="#1e293b" />
    <text x="12" y="18" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#f59e0b">
      📬 04 / HIRING STATUS
    </text>
    <line x1="10" y1="26" x2="204" y2="26" stroke="#1e293b" />
    <g transform="translate(12, 42)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">
      <text y="0">✦ Available for AI Engineering Roles</text>
      <text y="18">✦ High-Paced Systems &amp; Startups</text>
      <text y="36" fill="#00f0ff" font-weight="600">✦ Contact: Ready to Interview ↗</text>
    </g>
  </g>
</svg>
