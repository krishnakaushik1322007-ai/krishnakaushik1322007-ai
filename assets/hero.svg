<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" fill="none">
  <defs>
    <style>
      @keyframes pulse-cyan {
        0%, 100% { opacity: 0.16; transform: scale(1); }
        50% { opacity: 0.32; transform: scale(1.08); }
      }
      @keyframes pulse-purple {
        0%, 100% { opacity: 0.12; transform: scale(1); }
        50% { opacity: 0.28; transform: scale(1.06); }
      }
      @keyframes ping-ring {
        0% { r: 3.5; opacity: 0.95; stroke-width: 1.5; }
        60% { r: 9; opacity: 0; stroke-width: 0.5; }
        100% { r: 9; opacity: 0; stroke-width: 0; }
      }
      @keyframes cursor-blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes border-sweep {
        0%, 100% { stroke: #00f0ff; stroke-opacity: 0.85; filter: drop-shadow(0 0 3px #00f0ff); }
        33% { stroke: #a855f7; stroke-opacity: 0.85; filter: drop-shadow(0 0 3px #a855f7); }
        66% { stroke: #00ff9d; stroke-opacity: 0.85; filter: drop-shadow(0 0 3px #00ff9d); }
      }
      @keyframes shimmer-sweep {
        0% { transform: translateX(-150px); }
        100% { transform: translateX(350px); }
      }
      @keyframes badge-pulse {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 1; filter: drop-shadow(0 0 4px #00f0ff); }
      }
      .ambient-c {
        transform-origin: 15% 25%;
        animation: pulse-cyan 5s ease-in-out infinite;
      }
      .ambient-p {
        transform-origin: 85% 50%;
        animation: pulse-purple 7s ease-in-out infinite;
      }
      .ping-effect {
        animation: ping-ring 2.2s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      .cursor-elem {
        animation: cursor-blink 1.0s step-start infinite;
      }
      .animated-frame {
        animation: border-sweep 6s ease-in-out infinite;
      }
      .shimmer-light {
        animation: shimmer-sweep 3s ease-in-out infinite;
      }
    </style>

    <!-- Base Gradient -->
    <linearGradient id="h-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020614" />
      <stop offset="50%" stop-color="#070e24" />
      <stop offset="100%" stop-color="#030612" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="h-glow-cyan" cx="15%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="1" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="h-glow-purple" cx="85%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="1" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Dot Pattern -->
    <pattern id="h-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#334155" fill-opacity="0.38" />
    </pattern>

    <!-- Glass HUD Fill -->
    <linearGradient id="hud-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1430" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#050817" stop-opacity="0.95" />
    </linearGradient>

    <!-- Metric Progress Bars -->
    <linearGradient id="h-bar-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff9d" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="h-bar-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="h-bar-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <!-- Container Box with Animated Glowing Border -->
  <rect x="1" y="1" width="898" height="268" rx="14" fill="url(#h-bg)" stroke="#00f0ff" stroke-width="1.4" class="animated-frame" />

  <!-- Ambient Pulsing Glow Fields -->
  <rect x="2" y="2" width="896" height="266" rx="14" fill="url(#h-glow-cyan)" class="ambient-c" />
  <rect x="2" y="2" width="896" height="266" rx="14" fill="url(#h-glow-purple)" class="ambient-p" />
  <rect x="2" y="34" width="896" height="234" fill="url(#h-grid)" />

  <!-- Top Window Bar -->
  <path d="M 0 14 C 0 6.27 6.27 0 14 0 L 886 0 C 893.73 0 900 6.27 900 14 L 900 34 L 0 34 Z" fill="#080e22" />
  <line x1="0" y1="34" x2="900" y2="34" stroke="#1e293b" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="20" cy="17" r="4.5" fill="#ef4444" opacity="0.9" />
  <circle cx="36" cy="17" r="4.5" fill="#f59e0b" opacity="0.9" />
  <circle cx="52" cy="17" r="4.5" fill="#10b981" opacity="0.9" />

  <!-- Terminal Path + Animated Blinking Cursor -->
  <text x="74" y="21" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#64748b" letter-spacing="0.5">
    krishna-kaushik // ai-systems-executive-spec.sh
  </text>
  <rect x="360" y="11" width="6" height="12" fill="#00f0ff" class="cursor-elem" />

  <text x="876" y="21" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#00ff9d" text-anchor="end" letter-spacing="0.6">
    ● ACTIVE CANDIDATE // 2026 COHORT
  </text>

  <!-- LEFT COLUMN: EXECUTIVE OVERVIEW -->
  <!-- Status Badge with Ripple Ring -->
  <g transform="translate(30, 52)">
    <rect x="0" y="0" width="330" height="23" rx="11.5" fill="#0b1633" stroke="#1e293b" />
    <circle cx="12" cy="11.5" r="3.5" fill="#00ff9d" />
    <circle cx="12" cy="11.5" r="3.5" stroke="#00ff9d" fill="none" class="ping-effect" />
    <text x="26" y="15" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#cbd5e1" font-weight="600" letter-spacing="0.8">
      AVAILABLE FOR ROLES · SHOOLINI UNIV (CSE-AI)
    </text>
  </g>

  <!-- Name -->
  <text x="30" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="#f8fafc" letter-spacing="-0.7">
    Krishna Kaushik
  </text>

  <!-- Title / Positioning -->
  <text x="30" y="137" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#00f0ff" letter-spacing="0.3">
    AI Systems Engineer &amp; Full-Stack Architect
  </text>

  <!-- Value Statement for Companies -->
  <text x="30" y="163" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#cbd5e1">
    Specializing in production-grade AI platforms, geospatial intelligence,
  </text>
  <text x="30" y="181" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#cbd5e1">
    and low-level computational efficiency (C/C++, PostGIS, Next.js, FastAPI).
  </text>

  <!-- Bottom Fast-Scan Pills -->
  <g transform="translate(30, 206)">
    <rect x="0" y="0" width="102" height="25" rx="6" fill="#0f1a38" stroke="#1e293b" />
    <circle cx="10" cy="12.5" r="3" fill="#00f0ff" />
    <text x="18" y="16.5" font-family="ui-monospace, monospace" font-size="10.5" fill="#f8fafc" font-weight="600">C++ / CUDA</text>

    <rect x="110" y="0" width="112" height="25" rx="6" fill="#0f1a38" stroke="#1e293b" />
    <circle cx="120" cy="12.5" r="3" fill="#a855f7" />
    <text x="128" y="16.5" font-family="ui-monospace, monospace" font-size="10.5" fill="#f8fafc" font-weight="600">Agentic RAG</text>

    <rect x="230" y="0" width="106" height="25" rx="6" fill="#0f1a38" stroke="#1e293b" />
    <circle cx="240" cy="12.5" r="3" fill="#00ff9d" />
    <text x="248" y="16.5" font-family="ui-monospace, monospace" font-size="10.5" fill="#f8fafc" font-weight="600">PostGIS 3.6</text>

    <rect x="344" y="0" width="114" height="25" rx="6" fill="#0f1a38" stroke="#1e293b" />
    <circle cx="354" cy="12.5" r="3" fill="#f59e0b" />
    <text x="362" y="16.5" font-family="ui-monospace, monospace" font-size="10.5" fill="#f8fafc" font-weight="600">Next.js 16 RLS</text>
  </g>

  <!-- RIGHT COLUMN: RECRUITER HUD & PRODUCTION PROOF -->
  <g transform="translate(525, 50)">
    <rect x="0" y="0" width="345" height="186" rx="10" fill="url(#hud-glass)" stroke="#1e293b" stroke-width="1.2" />

    <!-- HUD Header -->
    <path d="M 0 10 C 0 4.47 4.47 0 10 0 L 335 0 C 340.53 0 345 4.47 345 10 L 345 27 L 0 27 Z" fill="#070e24" />
    <line x1="0" y1="27" x2="345" y2="27" stroke="#1e293b" />
    <circle cx="12" cy="13.5" r="3" fill="#334155" />
    <circle cx="22" cy="13.5" r="3" fill="#334155" />
    <text x="34" y="17.5" font-family="ui-monospace, monospace" font-size="9.5" fill="#94a3b8" font-weight="600">PRODUCTION_PROOF_MANIFEST</text>
    <text x="333" y="17.5" font-family="ui-monospace, monospace" font-size="9.5" fill="#00ff9d" text-anchor="end" font-weight="700">● SHIPPED</text>

    <!-- Metric 1: CivicLens Spatial Noise Reduction -->
    <g transform="translate(16, 43)">
      <text y="0" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">CivicLens 311 Deduplication</text>
      <text x="313" y="0" font-family="ui-monospace, monospace" font-size="10" fill="#00f0ff" text-anchor="end" font-weight="700">40.4% ST_DWithin</text>
      <rect x="0" y="6" width="313" height="4.5" rx="2" fill="#1e293b" />
      <rect x="0" y="6" width="250" height="4.5" rx="2" fill="url(#h-bar-blue)" />
    </g>

    <!-- Metric 2: CampusOS Security -->
    <g transform="translate(16, 76)">
      <text y="0" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">CampusOS Security Isolation</text>
      <text x="313" y="0" font-family="ui-monospace, monospace" font-size="10" fill="#00ff9d" text-anchor="end" font-weight="700">15 RLS Tables</text>
      <rect x="0" y="6" width="313" height="4.5" rx="2" fill="#1e293b" />
      <rect x="0" y="6" width="280" height="4.5" rx="2" fill="url(#h-bar-green)" />
    </g>

    <!-- Metric 3: Automated Test Suite -->
    <g transform="translate(16, 109)">
      <text y="0" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">Agentic RAG Test Verification</text>
      <text x="313" y="0" font-family="ui-monospace, monospace" font-size="10" fill="#c084fc" text-anchor="end" font-weight="700">8/8 Test Suite Passed</text>
      <rect x="0" y="6" width="313" height="4.5" rx="2" fill="#1e293b" />
      <rect x="0" y="6" width="295" height="4.5" rx="2" fill="url(#h-bar-purple)" />
    </g>

    <!-- Recruiter Action Row -->
    <g transform="translate(16, 148)">
      <line x1="0" y1="-8" x2="313" y2="-8" stroke="#1e293b" />
      <text y="4" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748b">
        Core: <tspan fill="#f8fafc" font-weight="600">Python · C++ · TypeScript · SQL</tspan>
      </text>
      <text x="313" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#00f0ff" text-anchor="end">
        Hire / Collaborate ↗
      </text>
    </g>
  </g>
</svg>
