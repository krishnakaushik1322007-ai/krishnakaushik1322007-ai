<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="60%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="80%" stop-color="#34d399" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.2" />
    </linearGradient>

    <!-- Code Panel Gradient -->
    <linearGradient id="code-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="100%" stop-color="#070b16" />
    </linearGradient>

    <!-- Subtle Dot Pattern -->
    <pattern id="grid-pattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#334155" fill-opacity="0.45" />
    </pattern>

    <!-- Glow effect -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="0.5" y="0.5" width="899" height="239" rx="12" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1" />

  <!-- Background Dots -->
  <rect x="1" y="32" width="898" height="206" fill="url(#grid-pattern)" />

  <!-- Window Header Bar -->
  <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 888 0 C 894.63 0 900 5.37 900 12 L 900 32 L 0 32 Z" fill="#0d1424" />
  <line x1="0" y1="32" x2="900" y2="32" stroke="#1e293b" stroke-width="1" />

  <!-- Window Control Dots -->
  <circle cx="20" cy="16" r="4.5" fill="#ef4444" opacity="0.85" />
  <circle cx="36" cy="16" r="4.5" fill="#f59e0b" opacity="0.85" />
  <circle cx="52" cy="16" r="4.5" fill="#10b981" opacity="0.85" />

  <!-- Window Title -->
  <text x="74" y="20" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#64748b" letter-spacing="0.5">
    krishna-kaushik // ai-systems-core [architecture-runtime]
  </text>
  <text x="876" y="20" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#38bdf8" text-anchor="end" letter-spacing="0.5">
    vLLM · PostGIS · CUDA
  </text>

  <!-- Left Content Column -->
  <!-- Status Badge -->
  <g transform="translate(28, 50)">
    <rect x="0" y="0" width="310" height="22" rx="11" fill="#0f172a" stroke="#1e293b" />
    <circle cx="11" cy="11" r="3.5" fill="#10b981" />
    <circle cx="11" cy="11" r="6" fill="#10b981" opacity="0.25" />
    <text x="24" y="15" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#94a3b8" letter-spacing="0.6">
      ONLINE · SHOOLINI UNIVERSITY (CSE-AI) · INDIA
    </text>
  </g>

  <!-- Name -->
  <text x="28" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">
    Krishna Kaushik
  </text>

  <!-- Role Subtitle -->
  <text x="28" y="130" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="0.2">
    AI Systems Architect &amp; Low-Level Computing Researcher
  </text>

  <!-- Philosophy / Bio text -->
  <text x="28" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#94a3b8">
    Bridging bare-metal efficiency (C/C++, CUDA) with scalable intelligence
  </text>
  <text x="28" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#94a3b8">
    (vLLM inference serving, spatial computing, and self-reflective RAG).
  </text>

  <!-- Bottom Pills -->
  <g transform="translate(28, 192)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="102" height="24" rx="6" fill="#0f172a" stroke="#334155" />
    <circle cx="10" cy="12" r="3" fill="#38bdf8" />
    <text x="18" y="16" font-family="ui-monospace, monospace" font-size="10.5" fill="#cbd5e1">C++ / CUDA</text>

    <!-- Pill 2 -->
    <rect x="110" y="0" width="112" height="24" rx="6" fill="#0f172a" stroke="#334155" />
    <circle cx="120" cy="12" r="3" fill="#a855f7" />
    <text x="128" y="16" font-family="ui-monospace, monospace" font-size="10.5" fill="#cbd5e1">vLLM Inference</text>

    <!-- Pill 3 -->
    <rect x="230" y="0" width="102" height="24" rx="6" fill="#0f172a" stroke="#334155" />
    <circle cx="240" cy="12" r="3" fill="#10b981" />
    <text x="248" y="16" font-family="ui-monospace, monospace" font-size="10.5" fill="#cbd5e1">PostGIS 3.6</text>

    <!-- Pill 4 -->
    <rect x="340" y="0" width="112" height="24" rx="6" fill="#0f172a" stroke="#334155" />
    <circle cx="350" cy="12" r="3" fill="#f59e0b" />
    <text x="358" y="16" font-family="ui-monospace, monospace" font-size="10.5" fill="#cbd5e1">Agentic RAG</text>
  </g>

  <!-- Right Code / Manifest Card -->
  <g transform="translate(520, 48)">
    <!-- Window card -->
    <rect x="0" y="0" width="352" height="172" rx="8" fill="url(#code-bg)" stroke="#1e293b" />
    
    <!-- Header of mini card -->
    <path d="M 0 8 C 0 3.58 3.58 0 8 0 L 344 0 C 348.42 0 352 3.58 352 8 L 352 24 L 0 24 Z" fill="#0b1120" />
    <line x1="0" y1="24" x2="352" y2="24" stroke="#1e293b" stroke-width="1" />
    <circle cx="12" cy="12" r="3" fill="#334155" />
    <circle cx="22" cy="12" r="3" fill="#334155" />
    <circle cx="32" cy="12" r="3" fill="#334155" />
    <text x="44" y="16" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748b">runtime_spec.json</text>
    <text x="340" y="16" font-family="ui-monospace, monospace" font-size="9" fill="#10b981" text-anchor="end">● verified</text>

    <!-- Code Snippet -->
    <g transform="translate(16, 42)" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" line-height="1.5">
      <text y="0" fill="#64748b">{</text>
      <text y="18" fill="#94a3b8">  <tspan fill="#38bdf8">"architect"</tspan>: <tspan fill="#f1f5f9">"Krishna Kaushik"</tspan>,</text>
      <text y="36" fill="#94a3b8">  <tspan fill="#38bdf8">"focus"</tspan>: <tspan fill="#f1f5f9">"Low-Latency AI Serving"</tspan>,</text>
      <text y="54" fill="#94a3b8">  <tspan fill="#38bdf8">"spatial_engine"</tspan>: <tspan fill="#f1f5f9">"CivicLens (PostGIS)"</tspan>,</text>
      <text y="72" fill="#94a3b8">  <tspan fill="#38bdf8">"core_stack"</tspan>: [<tspan fill="#a855f7">"C++"</tspan>, <tspan fill="#a855f7">"CUDA"</tspan>, <tspan fill="#a855f7">"vLLM"</tspan>],</text>
      <text y="90" fill="#94a3b8">  <tspan fill="#38bdf8">"optimization"</tspan>: <tspan fill="#10b981">"sub-12ms TTFT"</tspan>,</text>
      <text y="108" fill="#94a3b8">  <tspan fill="#38bdf8">"status"</tspan>: <tspan fill="#34d399">"Open for Collaboration"</tspan></text>
      <text y="126" fill="#64748b">}</text>
    </g>
  </g>
</svg>
