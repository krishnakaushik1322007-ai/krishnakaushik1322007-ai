<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="900" height="180" fill="none">
  <defs>
    <linearGradient id="radar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040713" />
      <stop offset="50%" stop-color="#080d22" />
      <stop offset="100%" stop-color="#050816" />
    </linearGradient>

    <linearGradient id="radar-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="radar-panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1228" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#060917" stop-opacity="0.9" />
    </linearGradient>

    <pattern id="radar-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.65" fill="#334155" fill-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Frame -->
  <rect x="0.5" y="0.5" width="899" height="179" rx="12" fill="url(#radar-bg)" stroke="url(#radar-border)" stroke-width="1.2" />
  <rect x="1" y="32" width="898" height="147" fill="url(#radar-grid)" />

  <!-- Header -->
  <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 888 0 C 894.63 0 900 5.37 900 12 L 900 32 L 0 32 Z" fill="#080e20" />
  <line x1="0" y1="32" x2="900" y2="32" stroke="#1e293b" />

  <circle cx="20" cy="16" r="4" fill="#a855f7" />
  <text x="32" y="20" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#94a3b8" letter-spacing="0.6">
    FRONTIER RADAR  //  WHAT TO LEARN NEXT FOR AI SYSTEMS ENGINEERS
  </text>
  <text x="880" y="20" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#a855f7" text-anchor="end" letter-spacing="0.5">
    ● ACTIVE LEARNING ROADMAP
  </text>

  <!-- 3 Columns -->
  <!-- Vector 1 -->
  <g transform="translate(18, 44)">
    <rect x="0" y="0" width="276" height="122" rx="8" fill="url(#radar-panel)" stroke="#1e293b" />
    <circle cx="14" cy="16" r="3.5" fill="#38bdf8" />
    <text x="24" y="19" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#38bdf8">
      01 / GPU KERNELS (TRITON &amp; CUDA)
    </text>
    <line x1="10" y1="28" x2="266" y2="28" stroke="#1e293b" />

    <g transform="translate(14, 44)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">
      <text y="0">✦ Writing fused attention kernels in Triton</text>
      <text y="20">✦ Memory hierarchy: SRAM vs HBM access</text>
      <text y="40">✦ FP8 / FP4 quantization (Marlin, AWQ)</text>
      <text y="62" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8">Target: Custom attention acceleration</text>
    </g>
  </g>

  <!-- Vector 2 -->
  <g transform="translate(312, 44)">
    <rect x="0" y="0" width="276" height="122" rx="8" fill="url(#radar-panel)" stroke="#1e293b" />
    <circle cx="14" cy="16" r="3.5" fill="#a855f7" />
    <text x="24" y="19" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#c084fc">
      02 / HIGH-THROUGHPUT INFERENCE
    </text>
    <line x1="10" y1="28" x2="266" y2="28" stroke="#1e293b" />

    <g transform="translate(14, 44)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">
      <text y="0">✦ vLLM PagedAttention internals &amp; KV cache</text>
      <text y="20">✦ Speculative decoding &amp; continuous batching</text>
      <text y="40">✦ TensorRT-LLM multi-GPU inference serving</text>
      <text y="62" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8">Target: Sub-10ms TTFT under concurrency</text>
    </g>
  </g>

  <!-- Vector 3 -->
  <g transform="translate(606, 44)">
    <rect x="0" y="0" width="276" height="122" rx="8" fill="url(#radar-panel)" stroke="#1e293b" />
    <circle cx="14" cy="16" r="3.5" fill="#34d399" />
    <text x="24" y="19" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#34d399">
      03 / POST-TRAINING &amp; REASONING
    </text>
    <line x1="10" y1="28" x2="266" y2="28" stroke="#1e293b" />

    <g transform="translate(14, 44)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">
      <text y="0">✦ RL with Verifiable Rewards (RLVR)</text>
      <text y="20">✦ GRPO policy optimization (DeepSeek-R1 style)</text>
      <text y="40">✦ Model Context Protocol (MCP) agent tools</text>
      <text y="62" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8">Target: Test-time compute scaling</text>
    </g>
  </g>
</svg>
