<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 205" width="900" height="205" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="stack-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <!-- Sub Card Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#090e1a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Subtle Dot Pattern -->
    <pattern id="stack-dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.65" fill="#334155" fill-opacity="0.35" />
    </pattern>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="0.5" y="0.5" width="899" height="204" rx="10" fill="url(#stack-bg)" stroke="#1e293b" />
  <rect x="1" y="30" width="898" height="174" fill="url(#stack-dots)" />

  <!-- Top Bar -->
  <path d="M 0 10 C 0 4.47 4.47 0 10 0 L 890 0 C 895.53 0 900 4.47 900 10 L 900 30 L 0 30 Z" fill="#0d1424" />
  <line x1="0" y1="30" x2="900" y2="30" stroke="#1e293b" />

  <text x="18" y="19" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#64748b" letter-spacing="0.5">
    TECHNICAL SURFACE  //  ENGINEERING &amp; RESEARCH STACK
  </text>
  <text x="882" y="19" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#38bdf8" text-anchor="end">
    CORE DOMAINS
  </text>

  <!-- 4 Bento Columns -->
  <!-- Col 1: Systems & Low-Level -->
  <g transform="translate(18, 42)">
    <rect x="0" y="0" width="202" height="148" rx="8" fill="url(#card-grad)" stroke="#1e293b" />
    <!-- Header pill -->
    <circle cx="14" cy="18" r="3.5" fill="#38bdf8" />
    <text x="24" y="21" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#38bdf8" letter-spacing="0.4">
      01 / LOW-LEVEL &amp; SYS
    </text>
    <line x1="10" y1="32" x2="192" y2="32" stroke="#1e293b" />

    <!-- Items -->
    <g transform="translate(14, 48)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">
      <text y="0">✦ <tspan fill="#f8fafc" font-weight="600">C &amp; C++</tspan> (STL, Memory, OOP)</text>
      <text y="24">✦ <tspan fill="#f8fafc" font-weight="600">CUDA</tspan> (Parallel Acceleration)</text>
      <text y="48">✦ <tspan fill="#f8fafc">Linux &amp; POSIX Shell</tspan></text>
      <text y="72">✦ <tspan fill="#94a3b8">Cache Locality &amp; Pointers</tspan></text>
    </g>
  </g>

  <!-- Col 2: AI & Inference -->
  <g transform="translate(236, 42)">
    <rect x="0" y="0" width="202" height="148" rx="8" fill="url(#card-grad)" stroke="#1e293b" />
    <circle cx="14" cy="18" r="3.5" fill="#a855f7" />
    <text x="24" y="21" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#a855f7" letter-spacing="0.4">
      02 / AI &amp; INFERENCE
    </text>
    <line x1="10" y1="32" x2="192" y2="32" stroke="#1e293b" />

    <g transform="translate(14, 48)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">
      <text y="0">✦ <tspan fill="#f8fafc" font-weight="600">PyTorch</tspan> &amp; Transformers</text>
      <text y="24">✦ <tspan fill="#f8fafc" font-weight="600">vLLM</tspan> (PagedAttention)</text>
      <text y="48">✦ <tspan fill="#f8fafc">Agentic &amp; Self-Reflective RAG</tspan></text>
      <text y="72">✦ <tspan fill="#94a3b8">FlashAttention &amp; QLoRA</tspan></text>
    </g>
  </g>

  <!-- Col 3: Spatial & Data -->
  <g transform="translate(454, 42)">
    <rect x="0" y="0" width="202" height="148" rx="8" fill="url(#card-grad)" stroke="#1e293b" />
    <circle cx="14" cy="18" r="3.5" fill="#10b981" />
    <text x="24" y="21" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#10b981" letter-spacing="0.4">
      03 / SPATIAL &amp; DATA
    </text>
    <line x1="10" y1="32" x2="192" y2="32" stroke="#1e293b" />

    <g transform="translate(14, 48)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">
      <text y="0">✦ <tspan fill="#f8fafc" font-weight="600">PostGIS 3.6</tspan> (Spatial Math)</text>
      <text y="24">✦ <tspan fill="#f8fafc" font-weight="600">PostgreSQL</tspan> &amp; Supabase RLS</text>
      <text y="48">✦ <tspan fill="#f8fafc">pgvector &amp; Qdrant</tspan></text>
      <text y="72">✦ <tspan fill="#94a3b8">Dense/Sparse Hybrid Index</tspan></text>
    </g>
  </g>

  <!-- Col 4: Platform & Cloud -->
  <g transform="translate(672, 42)">
    <rect x="0" y="0" width="210" height="148" rx="8" fill="url(#card-grad)" stroke="#1e293b" />
    <circle cx="14" cy="18" r="3.5" fill="#f59e0b" />
    <text x="24" y="21" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#f59e0b" letter-spacing="0.4">
      04 / PLATFORM &amp; CLOUD
    </text>
    <line x1="10" y1="32" x2="200" y2="32" stroke="#1e293b" />

    <g transform="translate(14, 48)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">
      <text y="0">✦ <tspan fill="#f8fafc" font-weight="600">FastAPI</tspan> (Async Python)</text>
      <text y="24">✦ <tspan fill="#f8fafc" font-weight="600">Next.js 16</tspan> &amp; React 19</text>
      <text y="48">✦ <tspan fill="#f8fafc">TypeScript &amp; Pydantic</tspan></text>
      <text y="72">✦ <tspan fill="#94a3b8">Docker &amp; Microservices</tspan></text>
    </g>
  </g>
</svg>
