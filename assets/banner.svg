<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" fill="none">
  <title>Krishna Kaushik — Neural Architecture &amp; Cognitive Intelligence Banner</title>
  <desc>Autonomous Agentic Swarms, High-Throughput Inference &amp; Latent Manifolds for Krishna Kaushik</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="45%" stop-color="#0a0f24" />
      <stop offset="80%" stop-color="#0c0a1f" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Neon Cyber Borders -->
    <linearGradient id="border-cyber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.65" />
      <stop offset="30%" stop-color="#3b82f6" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.65" />
    </linearGradient>

    <!-- Glowing Core Atmosphere -->
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.32" />
      <stop offset="45%" stop-color="#8b5cf6" stop-opacity="0.16" />
      <stop offset="85%" stop-color="#3b82f6" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#050811" stop-opacity="0" />
    </radialGradient>

    <!-- Sun / Neural Core Gradient -->
    <radialGradient id="quantum-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#a5f3fc" />
      <stop offset="55%" stop-color="#00f0ff" />
      <stop offset="85%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </radialGradient>

    <!-- Text Name Gradient -->
    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>

    <!-- High-Tech Cyber Grid Pattern -->
    <pattern id="cyber-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="28" cy="28" r="0.6" fill="#00f0ff" fill-opacity="0.22" />
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="0.35" stroke-opacity="0.45" />
    </pattern>

    <!-- Neon Glow Filter -->
    <filter id="neon-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif; }
    
    .title-name { font-weight: 900; font-size: 38px; letter-spacing: 5px; fill: url(#name-grad); }
    .title-sub { font-weight: 600; font-size: 13px; fill: #38bdf8; letter-spacing: 0.3px; }
    .title-desc { font-weight: 400; font-size: 11px; fill: #94a3b8; letter-spacing: 0.2px; }
    
    .tag-meta { font-size: 8.5px; font-weight: 700; fill: #00f0ff; letter-spacing: 1.8px; }
    .lbl-node { font-size: 7.5px; font-weight: 800; fill: #a5f3fc; text-anchor: middle; letter-spacing: 0.6px; }
    .lbl-core { font-size: 8.5px; font-weight: 900; fill: #ffffff; text-anchor: middle; letter-spacing: 1.8px; }
    
    .readout-title { font-size: 8.5px; font-weight: 800; fill: #00f0ff; letter-spacing: 1.6px; }
    .readout-key { font-size: 8.5px; font-weight: 500; fill: #94a3b8; letter-spacing: 0.6px; }
    .readout-val { font-size: 8.5px; font-weight: 700; fill: #f8fafc; letter-spacing: 0.5px; }
    .code-prompt { font-size: 8px; font-weight: 600; fill: #38bdf8; letter-spacing: 0.5px; }
    
    .pill-bg { fill: #0f172a; stroke: #1e293b; stroke-width: 0.8; }
    .pill-text { font-size: 8px; font-weight: 700; fill: #38bdf8; }
  </style>

  <!-- Outer Shell & Subtle Background -->
  <rect x="1" y="1" width="898" height="248" rx="12" fill="url(#bg-cyber)" stroke="url(#border-cyber)" stroke-width="1.2" />
  <rect x="2" y="2" width="896" height="246" rx="11" fill="url(#cyber-grid)" />

  <!-- Corner Tech Brackets (Cyber Accents) -->
  <path d="M 14 26 L 14 14 L 26 14" fill="none" stroke="#00f0ff" stroke-width="1.4" opacity="0.75" />
  <path d="M 886 26 L 886 14 L 874 14" fill="none" stroke="#a855f7" stroke-width="1.4" opacity="0.75" />
  <path d="M 14 224 L 14 236 L 26 236" fill="none" stroke="#a855f7" stroke-width="1.4" opacity="0.75" />
  <path d="M 886 224 L 886 236 L 874 236" fill="none" stroke="#00f0ff" stroke-width="1.4" opacity="0.75" />

  <!-- Top Center Status Beacon -->
  <g transform="translate(450, 10)">
    <circle cx="0" cy="0" r="2.5" fill="#00f0ff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
      <animate attributeName="r" values="2;3.2;2" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ================================================================= -->
  <!-- ZONE 1: LEFT — COGNITIVE IDENTITY & SPECIALIZATIONS               -->
  <!-- ================================================================= -->
  <g transform="translate(42, 46)">
    <!-- Meta Signal Header -->
    <g transform="translate(0, 0)">
      <circle cx="4" cy="4" r="2.5" fill="#00ff9d">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="14" y="7" class="mono tag-meta">COGNITIVE SYSTEMS &amp; AUTONOMOUS AGENTS</text>
    </g>

    <!-- Name with Neon Gradient -->
    <text x="0" y="52" class="sans title-name">KRISHNA</text>
    <text x="210" y="52" class="sans title-name" fill="#38bdf8" opacity="0.9">KAUSHIK</text>

    <!-- Subtitles -->
    <text x="0" y="80" class="sans title-sub">
      AI Engineer <tspan fill="#00f0ff">•</tspan> LLM Systems Architect <tspan fill="#a855f7">•</tspan> Low-Latency MLOps
    </text>

    <!-- Technical Mission Statement -->
    <text x="0" y="104" class="sans title-desc">
      Coupling low-level C++/CUDA speed with frontier multi-agent reasoning loops.
    </text>

    <!-- Mini Arsenal Tags -->
    <g transform="translate(0, 122)">
      <!-- Tag 1: PyTorch -->
      <rect x="0" y="0" width="56" height="18" rx="4" class="pill-bg" />
      <text x="28" y="12" class="mono pill-text" text-anchor="middle" fill="#f87171">PyTorch</text>

      <!-- Tag 2: vLLM -->
      <rect x="62" y="0" width="46" height="18" rx="4" class="pill-bg" />
      <text x="85" y="12" class="mono pill-text" text-anchor="middle" fill="#00f0ff">vLLM</text>

      <!-- Tag 3: Agents -->
      <rect x="114" y="0" width="52" height="18" rx="4" class="pill-bg" />
      <text x="140" y="12" class="mono pill-text" text-anchor="middle" fill="#c084fc">Agents</text>

      <!-- Tag 4: C++ / CUDA -->
      <rect x="172" y="0" width="66" height="18" rx="4" class="pill-bg" />
      <text x="205" y="12" class="mono pill-text" text-anchor="middle" fill="#38bdf8">C++/CUDA</text>

      <!-- Tag 5: RAG -->
      <rect x="244" y="0" width="42" height="18" rx="4" class="pill-bg" />
      <text x="265" y="12" class="mono pill-text" text-anchor="middle" fill="#34d399">RAG</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- ZONE 2: CENTER — MULTI-HEAD ATTENTION MANIFOLD & NEURAL CORE      -->
  <!-- ================================================================= -->
  <g id="neural-manifold">
    <!-- Breathing Quantum Atmosphere Flare -->
    <circle cx="510" cy="125" r="115" fill="url(#core-glow)">
      <animate attributeName="r" values="96;124;96" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.65;1;0.65" dur="5s" repeatCount="indefinite" />
    </circle>

    <!-- Multi-Head Attention Orbital Rings (Rotated Coordinate Tracks) -->
    <!-- Head 1: Query Head Track (Cyan) -->
    <ellipse cx="510" cy="125" rx="104" ry="44" fill="none" stroke="#00f0ff" stroke-width="0.9" stroke-dasharray="4 5" transform="rotate(-22 510 125)" opacity="0.55">
      <animate attributeName="stroke" values="#00f0ff;#38bdf8;#00f0ff" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite" />
    </ellipse>

    <!-- Head 2: Key Head Track (Violet) -->
    <ellipse cx="510" cy="125" rx="104" ry="44" fill="none" stroke="#a855f7" stroke-width="0.9" stroke-dasharray="4 5" transform="rotate(28 510 125)" opacity="0.55">
      <animate attributeName="stroke" values="#a855f7;#ec4899;#a855f7" dur="4.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4.8s" repeatCount="indefinite" />
    </ellipse>

    <!-- Head 3: Value Head Equator Track -->
    <circle cx="510" cy="125" r="76" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-dasharray="2 4" opacity="0.6">
      <animate attributeName="stroke" values="#1e293b;#3b82f6;#1e293b" dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- Orbiting Token Vectors (Continuous Motion) -->
    <!-- Token Q (Cyan) -->
    <circle r="2.6" fill="#00f0ff" filter="url(#neon-bloom)">
      <animateMotion path="M 406 125 A 104 44 -22 1 0 614 125 A 104 44 -22 1 0 406 125" dur="5.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1;0.4" dur="5.5s" repeatCount="indefinite" />
    </circle>

    <!-- Token K (Violet) -->
    <circle r="2.4" fill="#d946ef" filter="url(#neon-bloom)">
      <animateMotion path="M 614 125 A 104 44 28 1 1 406 125 A 104 44 28 1 1 614 125" dur="7.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;1;0.5" dur="7.2s" repeatCount="indefinite" />
    </circle>

    <!-- Token V (Emerald Green) -->
    <circle r="2.2" fill="#00ff9d">
      <animateMotion path="M 434 125 A 76 76 0 1 0 586 125 A 76 76 0 1 0 434 125" dur="9.0s" repeatCount="indefinite" />
    </circle>

    <!-- Neural Synapse Laser Interconnects -->
    <line x1="510" y1="125" x2="410" y2="70" stroke="#00f0ff" stroke-width="0.7" opacity="0.4">
      <animate attributeName="stroke" values="#00f0ff;#8b5cf6;#00f0ff" dur="3.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.2s" repeatCount="indefinite" />
    </line>
    <line x1="510" y1="125" x2="410" y2="180" stroke="#a855f7" stroke-width="0.7" opacity="0.4">
      <animate attributeName="stroke" values="#a855f7;#00f0ff;#a855f7" dur="4.0s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4.0s" repeatCount="indefinite" />
    </line>
    <line x1="510" y1="125" x2="610" y2="70" stroke="#38bdf8" stroke-width="0.7" opacity="0.4">
      <animate attributeName="stroke" values="#38bdf8;#d946ef;#38bdf8" dur="3.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.6s" repeatCount="indefinite" />
    </line>
    <line x1="510" y1="125" x2="610" y2="180" stroke="#00f0ff" stroke-width="0.7" opacity="0.4">
      <animate attributeName="stroke" values="#00f0ff;#3b82f6;#00f0ff" dur="4.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4.4s" repeatCount="indefinite" />
    </line>

    <!-- Peripheral Cognitive Nodes -->
    <!-- Node 1: ROUTER -->
    <g transform="translate(410, 70)">
      <circle cx="0" cy="0" r="12.5" fill="#080d1a" stroke="#00f0ff" stroke-width="1.1">
        <animate attributeName="stroke" values="#00f0ff;#8b5cf6;#00f0ff" dur="3.2s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="2.8" class="mono lbl-node">ROUTER</text>
    </g>

    <!-- Node 2: KV_CACHE -->
    <g transform="translate(410, 180)">
      <circle cx="0" cy="0" r="12.5" fill="#080d1a" stroke="#a855f7" stroke-width="1.1">
        <animate attributeName="stroke" values="#a855f7;#00f0ff;#a855f7" dur="4.0s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="2.8" class="mono lbl-node">KV_PAGING</text>
    </g>

    <!-- Node 3: ATTENTION (Top Zenith) -->
    <g transform="translate(510, 42)">
      <circle cx="0" cy="0" r="12" fill="#080d1a" stroke="#38bdf8" stroke-width="1.1">
        <animate attributeName="stroke" values="#38bdf8;#00ff9d;#38bdf8" dur="3.5s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="2.8" class="mono lbl-node">ATTENTION</text>
    </g>

    <!-- Node 4: CRITIC (Bottom Nadir) -->
    <g transform="translate(510, 208)">
      <circle cx="0" cy="0" r="12" fill="#080d1a" stroke="#00f0ff" stroke-width="1.1">
        <animate attributeName="stroke" values="#00f0ff;#a855f7;#00f0ff" dur="4.2s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="2.8" class="mono lbl-node">CRITIC</text>
    </g>

    <!-- Node 5: REASONER -->
    <g transform="translate(610, 70)">
      <circle cx="0" cy="0" r="12.5" fill="#080d1a" stroke="#d946ef" stroke-width="1.1">
        <animate attributeName="stroke" values="#d946ef;#38bdf8;#d946ef" dur="3.6s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="2.8" class="mono lbl-node">REASONER</text>
    </g>

    <!-- Node 6: LATENT -->
    <g transform="translate(610, 180)">
      <circle cx="0" cy="0" r="12.5" fill="#080d1a" stroke="#00f0ff" stroke-width="1.1">
        <animate attributeName="stroke" values="#00f0ff;#3b82f6;#00f0ff" dur="4.4s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="2.8" class="mono lbl-node">LATENT</text>
    </g>

    <!-- Central Neural Core -->
    <g transform="translate(510, 125)">
      <!-- Outer Pulsing Halo -->
      <circle cx="0" cy="0" r="28" fill="none" stroke="#00f0ff" stroke-width="0.9" opacity="0.35">
        <animate attributeName="r" values="25;35;25" dur="3.2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.5;0.05;0.5" dur="3.2s" repeatCount="indefinite" />
      </circle>
      
      <!-- Luminous Quantum Sphere -->
      <circle cx="0" cy="0" r="21" fill="url(#quantum-core)" stroke="#a5f3fc" stroke-width="1.6" filter="url(#neon-bloom)">
        <animate attributeName="stroke" values="#a5f3fc;#c084fc;#a5f3fc" dur="3s" repeatCount="indefinite" />
      </circle>
      
      <!-- Core Text Anchor -->
      <text x="0" y="3.5" class="mono lbl-core">NEURAL</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- ZONE 3: RIGHT — REAL-TIME COGNITIVE TELEMETRY HUD                 -->
  <!-- ================================================================= -->
  <g id="neural-telemetry" transform="translate(734, 52)">
    <!-- Header -->
    <text x="0" y="10" class="mono readout-title">SYS // NEURAL TELEMETRY</text>
    <line x1="0" y1="20" x2="124" y2="20" stroke="#1e293b" stroke-width="0.8" />
    <line x1="0" y1="20" x2="42" y2="20" stroke="#00f0ff" stroke-width="1.2" opacity="0.8" />

    <!-- Metric 1: INFERENCE -->
    <g transform="translate(0, 40)">
      <text x="0" y="0" class="mono readout-key">INFERENCE</text>
      <text x="124" y="0" class="mono readout-val" text-anchor="end" fill="#00f0ff">vLLM [FP8]</text>
    </g>

    <!-- Metric 2: KV CACHE -->
    <g transform="translate(0, 64)">
      <text x="0" y="0" class="mono readout-key">KV CACHE</text>
      <text x="124" y="0" class="mono readout-val" text-anchor="end">PAGED [98%]</text>
    </g>

    <!-- Metric 3: LATENCY -->
    <g transform="translate(0, 88)">
      <text x="0" y="0" class="mono readout-key">TTFT LATENCY</text>
      <text x="124" y="0" class="mono readout-val" text-anchor="end" fill="#00ff9d">11.8 ms</text>
    </g>

    <!-- Metric 4: STATUS -->
    <g transform="translate(0, 112)">
      <text x="0" y="0" class="mono readout-key">SWARM STATE</text>
      <text x="124" y="0" class="mono readout-val" text-anchor="end" fill="#c084fc">REASONING</text>
    </g>

    <!-- Subtle HUD Footer Divider -->
    <line x1="0" y1="126" x2="124" y2="126" stroke="#1e293b" stroke-width="0.8" />

    <!-- Interactive Shell Command Line -->
    <g transform="translate(0, 142)">
      <text x="0" y="0" class="mono code-prompt">
        <tspan fill="#00f0ff">❯</tspan> agent.reflect()
      </text>
      <!-- Blinking Cyan Cursor -->
      <rect x="94" y="-8" width="4" height="9" fill="#00f0ff" opacity="0.85">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
</svg>
