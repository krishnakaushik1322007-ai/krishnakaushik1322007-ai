<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 95" width="900" height="95" fill="none">
  <defs>
    <style>
      @keyframes radar-ping-act {
        0% { r: 3.5; opacity: 1; stroke-width: 1.5; }
        70% { r: 12; opacity: 0; stroke-width: 0.5; }
        100% { r: 12; opacity: 0; }
      }
      @keyframes signal-wave {
        0% { transform: translateX(0); }
        100% { transform: translateX(-40px); }
      }
      @keyframes neon-sweep {
        0%, 100% { stroke: #38bdf8; }
        50% { stroke: #34d399; }
      }
      .r-act-ping {
        animation: radar-ping-act 2.2s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      .sig-line {
        animation: signal-wave 2s linear infinite;
      }
      .tele-frame {
        animation: neon-sweep 6s ease-in-out infinite;
      }
    </style>

    <linearGradient id="act-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030713" />
      <stop offset="50%" stop-color="#080e22" />
      <stop offset="100%" stop-color="#030612" />
    </linearGradient>
  </defs>

  <!-- Frame -->
  <rect x="0.5" y="0.5" width="899" height="94" rx="10" fill="url(#act-bg)" stroke="#1e293b" stroke-width="1.2" class="tele-frame" />

  <!-- Top Line -->
  <line x1="0" y1="28" x2="900" y2="28" stroke="#1e293b" />

  <!-- Left: Live Activity Beacon -->
  <circle cx="20" cy="14" r="3.5" fill="#34d399" />
  <circle cx="20" cy="14" r="3.5" stroke="#34d399" fill="none" class="r-act-ping" />
  
  <text x="32" y="17.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#f8fafc" font-weight="700" letter-spacing="0.5">
    LIVE TELEMETRY // REAL-TIME GITHUB CONTRIBUTIONS &amp; COMMIT STREAM
  </text>
  
  <text x="880" y="17.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#38bdf8" text-anchor="end" letter-spacing="0.5">
    ● CONTINUOUS INTEGRATION
  </text>

  <!-- Bottom Row: Metrics & Signal Stream -->
  <g transform="translate(20, 52)">
    <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#ffffff">
      Daily Commit Frequency &amp; Repository Velocity
    </text>
    <text x="0" y="28" font-family="ui-monospace, monospace" font-size="10.5" fill="#94a3b8">
      Active automated CI/CD workflows generating live contribution grid metrics
    </text>
  </g>

  <!-- Right: Status Pill -->
  <g transform="translate(685, 42)">
    <rect x="0" y="0" width="195" height="34" rx="6" fill="#0c1736" stroke="#1e293b" />
    <circle cx="14" cy="17" r="3" fill="#34d399" />
    <text x="26" y="21" font-family="ui-monospace, monospace" font-size="10" fill="#34d399" font-weight="700">
      STATUS: DEPLOYED &amp; ACTIVE
    </text>
  </g>
</svg>
