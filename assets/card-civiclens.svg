<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 435 200" width="435" height="200" fill="none">
  <defs>
    <style>
      @keyframes ping-civic {
        0% { r: 4; opacity: 1; stroke-width: 1.5; }
        70% { r: 12; opacity: 0; stroke-width: 0.5; }
        100% { r: 12; opacity: 0; }
      }
      @keyframes border-civic {
        0%, 100% { stroke: #34d399; filter: drop-shadow(0 0 4px rgba(52, 211, 153, 0.4)); }
        50% { stroke: #38bdf8; filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.4)); }
      }
      .c-ping { animation: ping-civic 2.2s cubic-bezier(0, 0, 0.2, 1) infinite; }
      .c-border { animation: border-civic 5s ease-in-out infinite; }
    </style>

    <linearGradient id="card-civic-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04121a" />
      <stop offset="60%" stop-color="#061824" />
      <stop offset="100%" stop-color="#02080e" />
    </linearGradient>
  </defs>

  <!-- Outer Card Frame with Animated Glow -->
  <rect x="0.5" y="0.5" width="434" height="199" rx="10" fill="url(#card-civic-bg)" stroke="#34d399" stroke-width="1.3" class="c-border" />

  <!-- Top Header Row -->
  <g transform="translate(16, 16)">
    <circle cx="10" cy="10" r="4" fill="#34d399" />
    <circle cx="10" cy="10" r="4" stroke="#34d399" fill="none" class="c-ping" />
    <text x="24" y="14" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#34d399" font-weight="700" letter-spacing="0.6">
      SPATIAL AI // MUNICIPAL 311 TRIAGE
    </text>

    <!-- Measured Impact Pill -->
    <rect x="282" y="0" width="122" height="22" rx="11" fill="#042e1d" stroke="#34d399" />
    <text x="343" y="15" font-family="ui-monospace, monospace" font-size="10" fill="#34d399" font-weight="800" text-anchor="middle">
      40.4% DEDUPED
    </text>
  </g>

  <!-- Project Title & Subtitle -->
  <text x="16" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#ffffff">
    CivicLens
  </text>
  <text x="16" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#94a3b8">
    Autonomous Municipal Issue Triage &amp; Geospatial Intelligence
  </text>

  <!-- 3 High-Impact Value Bullets -->
  <g transform="translate(16, 108)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#cbd5e1">
    <text y="0">✦ <tspan fill="#ffffff" font-weight="600">Problem:</tspan> Duplicate 311 citizen report overload.</text>
    <text y="19">✦ <tspan fill="#ffffff" font-weight="600">Architecture:</tspan> Sub-meter PostGIS <tspan fill="#38bdf8" font-family="ui-monospace, monospace">ST_DWithin</tspan> + Gemini Vision.</text>
    <text y="38">✦ <tspan fill="#ffffff" font-weight="600">Impact:</tspan> <tspan fill="#34d399" font-weight="700">40.4% noise reduction</tspan> &amp; 6-factor automated priority scoring.</text>
  </g>

  <!-- Bottom Technology Tags -->
  <g transform="translate(16, 170)">
    <rect x="0" y="0" width="75" height="18" rx="4" fill="#0b242e" stroke="#164e63" />
    <text x="37" y="12.5" font-family="ui-monospace, monospace" font-size="9" fill="#38bdf8" text-anchor="middle">PostGIS 3.6</text>

    <rect x="82" y="0" width="85" height="18" rx="4" fill="#0b242e" stroke="#164e63" />
    <text x="124" y="12.5" font-family="ui-monospace, monospace" font-size="9" fill="#34d399" text-anchor="middle">Gemini Vision</text>

    <rect x="174" y="0" width="70" height="18" rx="4" fill="#0b242e" stroke="#164e63" />
    <text x="209" y="12.5" font-family="ui-monospace, monospace" font-size="9" fill="#e2e8f0" text-anchor="middle">Next.js 16</text>

    <rect x="251" y="0" width="65" height="18" rx="4" fill="#0b242e" stroke="#164e63" />
    <text x="283" y="12.5" font-family="ui-monospace, monospace" font-size="9" fill="#e2e8f0" text-anchor="middle">FastAPI</text>

    <text x="398" y="13" font-family="ui-monospace, monospace" font-size="10" fill="#34d399" text-anchor="end" font-weight="700">
      VIEW REPO ↗
    </text>
  </g>
</svg>
