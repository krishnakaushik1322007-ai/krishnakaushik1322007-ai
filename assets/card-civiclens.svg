<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 435 185" width="435" height="185" fill="none">
  <defs>
    <linearGradient id="card-civic-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="100%" stop-color="#040710" />
    </linearGradient>
    <linearGradient id="border-civic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.4" />
    </linearGradient>
    <radialGradient id="glow-civic" cx="10%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Card Body -->
  <rect x="0.5" y="0.5" width="434" height="184" rx="10" fill="url(#card-civic-bg)" stroke="url(#border-civic)" stroke-width="1.2" />
  <rect x="1" y="1" width="433" height="183" rx="10" fill="url(#glow-civic)" />

  <!-- Top Status Row -->
  <g transform="translate(18, 20)">
    <!-- Radar Icon -->
    <circle cx="10" cy="10" r="9" fill="#0f1f38" stroke="#0284c7" />
    <circle cx="10" cy="10" r="4.5" fill="#38bdf8" />
    <path d="M 10 10 L 17 5" stroke="#38bdf8" stroke-width="1.2" />
    
    <text x="26" y="14" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9.5" fill="#38bdf8" font-weight="600" letter-spacing="0.5">
      SPATIAL AI // 311 TRIAGE
    </text>

    <!-- Dedup Metric Badge -->
    <rect x="290" y="0" width="108" height="20" rx="10" fill="#052e16" stroke="#10b981" />
    <text x="344" y="13.5" font-family="ui-monospace, monospace" font-size="9.5" fill="#34d399" font-weight="700" text-anchor="middle">
      40.4% DEDUP
    </text>
  </g>

  <!-- Title -->
  <text x="18" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#f8fafc">
    CivicLens
  </text>
  <text x="18" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8">
    Municipal Spatial Intelligence &amp; Automated 311 Triage
  </text>

  <!-- Description -->
  <text x="18" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">
    Consolidates duplicate citizen reports using sub-meter <tspan fill="#38bdf8" font-family="ui-monospace, monospace">ST_DWithin</tspan>
  </text>
  <text x="18" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">
    geospatial clustering, paired with Gemini 2.5 Flash vision verification.
  </text>

  <!-- Bottom Bar: Tech & Action Link -->
  <line x1="18" y1="144" x2="416" y2="144" stroke="#1e293b" />
  <g transform="translate(18, 163)">
    <text font-family="ui-monospace, monospace" font-size="10" fill="#64748b">
      <tspan fill="#38bdf8">PostGIS 3.6</tspan> · FastAPI · Next.js 16 · Gemini
    </text>
    <text x="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="end">
      Inspect Architecture ↗
    </text>
  </g>
</svg>
