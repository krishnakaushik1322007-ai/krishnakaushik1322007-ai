<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 435 185" width="435" height="185" fill="none">
  <defs>
    <linearGradient id="card-campus-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f08" />
      <stop offset="100%" stop-color="#090603" />
    </linearGradient>
    <linearGradient id="border-campus" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#b45309" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.4" />
    </linearGradient>
    <radialGradient id="glow-campus" cx="10%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Card Body -->
  <rect x="0.5" y="0.5" width="434" height="184" rx="10" fill="url(#card-campus-bg)" stroke="url(#border-campus)" stroke-width="1.2" />
  <rect x="1" y="1" width="433" height="183" rx="10" fill="url(#glow-campus)" />

  <!-- Top Status Row -->
  <g transform="translate(18, 20)">
    <!-- Shield / Platform Icon -->
    <path d="M 10 3 L 17 6 L 17 12 C 17 15.5 13.5 18 10 19 C 6.5 18 3 15.5 3 12 L 3 6 Z" fill="#2d1c07" stroke="#f59e0b" stroke-width="1.2" />
    <path d="M 7 11 L 9.5 13.5 L 13.5 8.5" stroke="#fcd34d" stroke-width="1.2" />

    <text x="26" y="14" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9.5" fill="#f59e0b" font-weight="600" letter-spacing="0.5">
      ENTERPRISE SAAS // CAMPUS OS
    </text>

    <!-- RLS Policy Badge -->
    <rect x="290" y="0" width="108" height="20" rx="10" fill="#082f49" stroke="#0284c7" />
    <text x="344" y="13.5" font-family="ui-monospace, monospace" font-size="9.5" fill="#38bdf8" font-weight="700" text-anchor="middle">
      14 RLS TABLES
    </text>
  </g>

  <!-- Title -->
  <text x="18" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#f8fafc">
    CampusOS AI
  </text>
  <text x="18" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8">
    Multi-Tenant Campus Platform with RBAC &amp; Copilot
  </text>

  <!-- Description -->
  <text x="18" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">
    Role-isolated institutional SaaS for students, faculty, and administrators.
  </text>
  <text x="18" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">
    Enforces fine-grained data security across 14 PostgreSQL RLS policies.
  </text>

  <!-- Bottom Bar: Tech & Action Link -->
  <line x1="18" y1="144" x2="416" y2="144" stroke="#1e293b" />
  <g transform="translate(18, 163)">
    <text font-family="ui-monospace, monospace" font-size="10" fill="#64748b">
      <tspan fill="#f59e0b">Next.js 16</tspan> · TypeScript · Supabase · Tailwind
    </text>
    <text x="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#f59e0b" text-anchor="end">
      Explore Platform ↗
    </text>
  </g>
</svg>
