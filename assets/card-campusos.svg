<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 435 195" width="435" height="195" fill="none">
  <defs>
    <style>
      @keyframes shield-glow {
        0%, 100% { stroke: #f59e0b; filter: drop-shadow(0 0 2px #f59e0b); }
        50% { stroke: #fbbf24; filter: drop-shadow(0 0 6px #f59e0b); }
      }
      @keyframes campus-border-glow {
        0%, 100% { stroke: #f59e0b; stroke-opacity: 0.8; }
        50% { stroke: #b45309; stroke-opacity: 0.4; }
      }
      .s-pulse { animation: shield-glow 2.5s ease-in-out infinite; }
      .camp-border { animation: campus-border-glow 4s ease-in-out infinite; }
    </style>

    <linearGradient id="cam-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140d04" />
      <stop offset="100%" stop-color="#080501" />
    </linearGradient>
    <radialGradient id="cam-glow" cx="12%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect x="0.5" y="0.5" width="434" height="194" rx="10" fill="url(#cam-bg)" stroke="#f59e0b" stroke-width="1.2" class="camp-border" />
  <rect x="1" y="1" width="433" height="193" rx="10" fill="url(#cam-glow)" />

  <!-- Top Status Row -->
  <g transform="translate(18, 18)">
    <path d="M 10 3 L 17 6 L 17 12 C 17 15.5 13.5 18 10 19 C 6.5 18 3 15.5 3 12 L 3 6 Z" fill="#2d1c07" stroke="#f59e0b" stroke-width="1.3" class="s-pulse" />
    <path d="M 7 11 L 9.5 13.5 L 13.5 8.5" stroke="#fcd34d" stroke-width="1.3" />

    <text x="26" y="14" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9.5" fill="#f59e0b" font-weight="700" letter-spacing="0.5">
      ENTERPRISE SAAS // PRODUCTION PLATFORM
    </text>

    <!-- RLS Policy Badge -->
    <rect x="286" y="0" width="112" height="20" rx="10" fill="#082f49" stroke="#00f0ff" />
    <text x="342" y="13.5" font-family="ui-monospace, monospace" font-size="9.5" fill="#00f0ff" font-weight="800" text-anchor="middle">
      15 RLS TABLES
    </text>
  </g>

  <!-- Title & Subtitle -->
  <text x="18" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#f8fafc">
    CampusOS AI
  </text>
  <text x="18" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#94a3b8">
    Multi-Tenant School Operating System with Streaming Copilot
  </text>

  <!-- Bullets for Companies -->
  <g transform="translate(18, 102)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">
    <text y="0">✦ <tspan fill="#f8fafc" font-weight="600">The Problem:</tspan> Fragmented school administration &amp; insecure student data.</text>
    <text y="18">✦ <tspan fill="#f8fafc" font-weight="600">The Innovation:</tspan> Discrete RBAC enforced by <tspan fill="#f59e0b" font-weight="600">15 PostgreSQL RLS tables</tspan> + Supabase Auth.</text>
    <text y="36">✦ <tspan fill="#f8fafc" font-weight="600">The Outcome:</tspan> <tspan fill="#00ff9d" font-weight="700">Full-stack multi-portal SaaS</tspan> with streaming Gemini tutoring.</text>
  </g>

  <!-- Bottom Bar: Tech & Action Link -->
  <line x1="18" y1="152" x2="416" y2="152" stroke="#1e293b" />
  <g transform="translate(18, 172)">
    <text font-family="ui-monospace, monospace" font-size="10" fill="#64748b">
      <tspan fill="#f59e0b" font-weight="600">Next.js 16</tspan> · TypeScript · Supabase · FastAPI SSE
    </text>
    <text x="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f59e0b" text-anchor="end">
      Inspect Architecture &amp; Code ↗
    </text>
  </g>
</svg>
