<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 435 200" width="435" height="200" fill="none">
  <defs>
    <style>
      @keyframes ping-campus {
        0% { r: 4; opacity: 1; stroke-width: 1.5; }
        70% { r: 12; opacity: 0; stroke-width: 0.5; }
        100% { r: 12; opacity: 0; }
      }
      @keyframes border-campus {
        0%, 100% { stroke: #818cf8; filter: drop-shadow(0 0 4px rgba(129, 140, 248, 0.4)); }
        50% { stroke: #c084fc; filter: drop-shadow(0 0 4px rgba(192, 132, 252, 0.4)); }
      }
      .ca-ping { animation: ping-campus 2.2s cubic-bezier(0, 0, 0.2, 1) infinite; }
      .ca-border { animation: border-campus 5s ease-in-out infinite; }
    </style>

    <linearGradient id="card-camp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e24" />
      <stop offset="60%" stop-color="#121338" />
      <stop offset="100%" stop-color="#050614" />
    </linearGradient>
  </defs>

  <!-- Outer Card Frame with Animated Glow -->
  <rect x="0.5" y="0.5" width="434" height="199" rx="10" fill="url(#card-camp-bg)" stroke="#818cf8" stroke-width="1.3" class="ca-border" />

  <!-- Top Header Row -->
  <g transform="translate(16, 16)">
    <circle cx="10" cy="10" r="4" fill="#818cf8" />
    <circle cx="10" cy="10" r="4" stroke="#818cf8" fill="none" class="ca-ping" />
    <text x="24" y="14" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#818cf8" font-weight="700" letter-spacing="0.6">
      ENTERPRISE SAAS // MULTI-TENANT OS
    </text>

    <!-- Measured Impact Pill -->
    <rect x="282" y="0" width="122" height="22" rx="11" fill="#1e184a" stroke="#818cf8" />
    <text x="343" y="15" font-family="ui-monospace, monospace" font-size="10" fill="#818cf8" font-weight="800" text-anchor="middle">
      15 RLS TABLES
    </text>
  </g>

  <!-- Project Title & Subtitle -->
  <text x="16" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#ffffff">
    CampusOS AI
  </text>
  <text x="16" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#94a3b8">
    Institutional Operating System with Real-Time AI Copilots
  </text>

  <!-- 3 High-Impact Value Bullets -->
  <g transform="translate(16, 108)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#cbd5e1">
    <text y="0">✦ <tspan fill="#ffffff" font-weight="600">Problem:</tspan> Fragmented academic workflows &amp; student isolation.</text>
    <text y="19">✦ <tspan fill="#ffffff" font-weight="600">Architecture:</tspan> Strict multi-tenant RBAC across 15 Supabase RLS tables.</text>
    <text y="38">✦ <tspan fill="#ffffff" font-weight="600">Impact:</tspan> <tspan fill="#818cf8" font-weight="700">Sub-100ms API routes</tspan> &amp; unified institutional intelligence.</text>
  </g>

  <!-- Bottom Technology Tags -->
  <g transform="translate(16, 170)">
    <rect x="0" y="0" width="75" height="18" rx="4" fill="#1a1c4a" stroke="#3730a3" />
    <text x="37" y="12.5" font-family="ui-monospace, monospace" font-size="9" fill="#818cf8" text-anchor="middle">Next.js 16</text>

    <rect x="82" y="0" width="80" height="18" rx="4" fill="#1a1c4a" stroke="#3730a3" />
    <text x="122" y="12.5" font-family="ui-monospace, monospace" font-size="9" fill="#38bdf8" text-anchor="middle">TypeScript</text>

    <rect x="169" y="0" width="75" height="18" rx="4" fill="#1a1c4a" stroke="#3730a3" />
    <text x="206" y="12.5" font-family="ui-monospace, monospace" font-size="9" fill="#34d399" text-anchor="middle">Supabase</text>

    <rect x="251" y="0" width="65" height="18" rx="4" fill="#1a1c4a" stroke="#3730a3" />
    <text x="283" y="12.5" font-family="ui-monospace, monospace" font-size="9" fill="#e2e8f0" text-anchor="middle">Tailwind</text>

    <text x="398" y="13" font-family="ui-monospace, monospace" font-size="10" fill="#818cf8" text-anchor="end" font-weight="700">
      VIEW REPO ↗
    </text>
  </g>
</svg>
